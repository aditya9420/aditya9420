name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: aditya9420
          cards: overview,momentum,contributions,rhythm,repositories,languages
          output-dir: assets
          themes: dark
          commit: true
          commit-message: "Update GitHub profile cards"
